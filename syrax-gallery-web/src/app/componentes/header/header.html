<nav class="navbar navbar-expand-md navbar-syrax">
  <div class="container">
    <a routerLink="/" class="navbar-brand marca">
      <i class="fa-solid fa-dragon"></i>
      <span class="marca-texto">
        <span class="marca-nombre">SYRAX</span>
        <span class="marca-sub">GALLERY</span>
      </span>
    </a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav mx-auto gap-md-3">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Inicio</a>
        </li>
        <li class="nav-item">
          <a routerLink="/catalogo" routerLinkActive="active" class="nav-link">Catálogo</a>
        </li>
        @if (isLoggedIn() && tieneRol('ZENTYS')) {
          <li class="nav-item">
            <a routerLink="/mis-compras" routerLinkActive="active" class="nav-link">Mis compras</a>
          </li>
        }
      </ul>
      <div class="d-flex gap-2">
        @if (isLoggedIn()) {
          <button class="btn btn-outline-syrax btn-sm" (click)="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login" class="btn btn-outline-syrax btn-sm">
            <i class="fa-regular fa-user me-1"></i>Iniciar sesión
          </a>
        }
      </div>
    </div>
  </div>
</nav>
