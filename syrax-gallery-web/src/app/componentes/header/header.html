<nav class="navbar navbar-expand-md navbar-dark navbar-syrax shadow-sm">
  <div class="container">
    <a routerLink="/" class="navbar-brand d-flex align-items-center gap-2">
      <i class="fa-solid fa-palette"></i>
      <span>Syrax Gallery</span>
    </a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
            <i class="fa-solid fa-house me-1"></i>Inicio
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/catalogo" routerLinkActive="active" class="nav-link">
            <i class="fa-solid fa-store me-1"></i>Catálogo
          </a>
        </li>
        @if (isLoggedIn() && tieneRol('ZENTYS')) {
          <li class="nav-item">
            <a routerLink="/mis-compras" routerLinkActive="active" class="nav-link">
              <i class="fa-solid fa-bag-shopping me-1"></i>Mis compras
            </a>
          </li>
        }
      </ul>
      <div class="d-flex gap-2">
        @if (isLoggedIn()) {
          <button class="btn btn-outline-light btn-sm" (click)="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login" class="btn btn-outline-light btn-sm">
            <i class="fa-solid fa-right-to-bracket me-1"></i>Iniciar sesión
          </a>
        }
      </div>
    </div>
  </div>
</nav>
