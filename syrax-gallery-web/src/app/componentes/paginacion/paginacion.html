@if (totalPaginas() > 0) {
  <nav class="d-flex justify-content-center align-items-center gap-3 mt-4" aria-label="Paginación">
    <button type="button" class="btn btn-outline-syrax" (click)="anterior.emit()" [disabled]="pagina() === 0">
      <i class="fa-solid fa-chevron-left me-1"></i>Anterior
    </button>
    <span>Página {{ pagina() + 1 }} de {{ totalPaginas() }}</span>
    <button type="button" class="btn btn-outline-syrax" (click)="siguiente.emit()"
            [disabled]="pagina() + 1 >= totalPaginas()">
      Siguiente<i class="fa-solid fa-chevron-right ms-1"></i>
    </button>
  </nav>
}
