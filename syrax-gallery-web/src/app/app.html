<header>
  <p>Bienvenido a {{ title() }}</p>
  <ul>
    <li><a routerLink="/">Inicio</a></li>
    <li>
      @if (auth.isAuthenticated()) {
        <a href="#" (click)="auth.logout(); $event.preventDefault()">Cerrar sesión</a>
      } @else {
        <a routerLink="/login">Iniciar sesión</a>
      }
    </li>
    <li><a routerLink="/catalogo">Catalogo</a></li>
  </ul>
</header>
<router-outlet/>
<footer>
  <p>{{ footer() }}</p>
</footer>
